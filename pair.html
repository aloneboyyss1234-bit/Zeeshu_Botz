
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>JAWAD-MD | Mini BOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-body: #0a0a0f;
      --bg-card: rgba(20, 20, 30, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.1);
      --bg-input: rgba(255, 255, 255, 0.05);
      --bg-input-focus: rgba(255, 255, 255, 0.08);
      --bg-server-info: rgba(102, 126, 234, 0.1);
      --bg-server-info-border: rgba(102, 126, 234, 0.3);
      --bg-server-option: rgba(255, 255, 255, 0.06);
      --bg-server-option-border: rgba(255, 255, 255, 0.1);
      --bg-server-selection: rgba(15, 15, 25, 0.95);
      --bg-code-box: rgba(0, 0, 0, 0.4);
      --bg-code-box-border: rgba(255, 255, 255, 0.1);
      --bg-copy-btn: rgba(255, 255, 255, 0.1);
      --bg-copy-btn-border: rgba(255, 255, 255, 0.2);
      
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.6);
      --text-dim: rgba(255, 255, 255, 0.5);
      --text-faint: rgba(255, 255, 255, 0.4);
      --text-placeholder: rgba(255, 255, 255, 0.4);
      
      --accent-1: #667eea;
      --accent-2: #764ba2;
      --accent-success: #00d4aa;
      --accent-error: #ff6b6b;
      --accent-warn: #ffa500;
      
      --input-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
      --footer-border: rgba(255, 255, 255, 0.1);
      --orb-opacity: 0.3;
    }

    body.theme-dark {
      --bg-body: #000000;
      --bg-card: rgba(15, 15, 20, 0.95);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --bg-input: rgba(255, 255, 255, 0.03);
      --bg-input-focus: rgba(255, 255, 255, 0.06);
      --bg-server-info: rgba(80, 100, 200, 0.08);
      --bg-server-info-border: rgba(80, 100, 200, 0.25);
      --bg-server-option: rgba(255, 255, 255, 0.03);
      --bg-server-option-border: rgba(255, 255, 255, 0.06);
      --bg-server-selection: rgba(10, 10, 15, 0.98);
      --bg-code-box: rgba(0, 0, 0, 0.6);
      --bg-code-box-border: rgba(255, 255, 255, 0.08);
      --bg-copy-btn: rgba(255, 255, 255, 0.05);
      --bg-copy-btn-border: rgba(255, 255, 255, 0.15);
      
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-dim: rgba(255, 255, 255, 0.45);
      --text-faint: rgba(255, 255, 255, 0.35);
      --text-placeholder: rgba(255, 255, 255, 0.35);
      
      --input-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
      --footer-border: rgba(255, 255, 255, 0.08);
      --orb-opacity: 0.15;
    }

    body.theme-light {
      --bg-body: #e8ecf4;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-border: rgba(0, 0, 0, 0.08);
      --bg-input: rgba(0, 0, 0, 0.03);
      --bg-input-focus: rgba(102, 126, 234, 0.06);
      --bg-server-info: rgba(102, 126, 234, 0.08);
      --bg-server-info-border: rgba(102, 126, 234, 0.25);
      --bg-server-option: rgba(0, 0, 0, 0.03);
      --bg-server-option-border: rgba(0, 0, 0, 0.08);
      --bg-server-selection: rgba(255, 255, 255, 0.95);
      --bg-code-box: rgba(0, 0, 0, 0.03);
      --bg-code-box-border: rgba(0, 0, 0, 0.1);
      --bg-copy-btn: rgba(0, 0, 0, 0.05);
      --bg-copy-btn-border: rgba(0, 0, 0, 0.1);
      
      --text-primary: #1a1a2e;
      --text-secondary: rgba(20, 20, 40, 0.85);
      --text-muted: rgba(20, 20, 40, 0.65);
      --text-dim: rgba(20, 20, 40, 0.55);
      --text-faint: rgba(20, 20, 40, 0.45);
      --text-placeholder: rgba(20, 20, 40, 0.4);
      
      --input-border: rgba(0, 0, 0, 0.1);
      --card-shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
      --footer-border: rgba(0, 0, 0, 0.08);
      --orb-opacity: 0.2;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .bg-gradient {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(102, 126, 234, 0.15) 0%, transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.15) 0%, transparent 60%),
                  var(--bg-body);
      z-index: 0;
      transition: background 0.4s ease;
    }

    .glow-orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: var(--orb-opacity);
      z-index: 1;
      animation: float 20s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    .orb-1 {
      top: -200px;
      left: -200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .orb-2 {
      bottom: -200px;
      right: -200px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-50px, 50px) scale(0.9); }
    }

    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--bg-card-border);
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      animation: slideIn 0.6s ease;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
    }

    .theme-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .theme-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg-input);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .theme-btn:hover {
      background: var(--bg-input-focus);
      transform: scale(1.1);
    }

    .theme-menu {
      position: absolute;
      top: 50px;
      right: 0;
      background: var(--bg-server-selection);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 130px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.2s ease;
    }

    .theme-menu.show { display: flex; }

    .theme-option {
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .theme-option:hover {
      background: var(--bg-server-info);
      color: var(--text-primary);
    }

    .theme-option.active {
      background: var(--bg-server-info);
      border-color: var(--accent-1);
      color: var(--text-primary);
    }

    .theme-option i {
      font-size: 14px;
      width: 16px;
      text-align: center;
    }

    .bot-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      background: var(--bg-input);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--input-border);
    }

    .bot-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .bot-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.35);
    }

    .bot-btn:not(.active):hover {
      background: var(--bg-input-focus);
      color: var(--text-primary);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      position: relative;
    }

    .logo-ring {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top-color: #667eea;
      border-right-color: #764ba2;
      border-radius: 50%;
      animation: spin 3s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: white;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .server-info {
      background: var(--bg-server-info);
      border: 1px solid var(--bg-server-info-border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .server-info:hover {
      border-color: var(--accent-1);
      transform: translateY(-2px);
    }

    .server-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .server-info-left > i {
      color: var(--accent-1);
      font-size: 20px;
      flex-shrink: 0;
    }

    .server-details { flex: 1; }

    .server-name {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .server-stats {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .server-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
    }

    .server-stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-faint);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .server-stat-label i { font-size: 9px; }

    .server-stat-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 18px;
    }

    .server-stat-value i { font-size: 10px; }

    .change-server-btn {
      background: var(--bg-input);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .change-server-btn:hover {
      background: var(--bg-input-focus);
      transform: translateY(-2px);
    }

    .server-selection {
      display: none;
      background: var(--bg-server-selection);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      max-height: 320px;
      overflow-y: auto;
    }

    .server-selection.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .server-selection-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-secondary);
      text-align: center;
      letter-spacing: 0.3px;
    }

    .server-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .server-option {
      background: var(--bg-server-option);
      border: 1px solid var(--bg-server-option-border);
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
    }

    .server-option:hover {
      background: rgba(102, 126, 234, 0.15);
      border-color: rgba(102, 126, 234, 0.4);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .server-option.selected {
      background: rgba(102, 126, 234, 0.2);
      border-color: #667eea;
      color: var(--text-primary);
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.15);
    }

    .instruction-box {
      background: rgba(0, 212, 170, 0.06);
      border: 1px solid rgba(0, 212, 170, 0.2);
      border-radius: 16px;
      margin-bottom: 25px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .instruction-box.expanded {
      border-color: rgba(0, 212, 170, 0.4);
      background: rgba(0, 212, 170, 0.08);
    }

    .instruction-intro {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 212, 170, 0.1);
    }

    .instruction-intro i {
      color: #00d4aa;
      font-size: 18px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .instruction-intro p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .instruction-intro .highlight {
      color: var(--accent-1);
      font-weight: 500;
    }

    .instruction-toggle {
      width: 100%;
      padding: 10px 20px 14px 20px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .instruction-toggle:hover {
      color: var(--text-primary);
    }

    .instruction-toggle i {
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .instruction-box.expanded .instruction-toggle i {
      transform: rotate(180deg);
    }

    @keyframes pulse-glow {
      0%, 100% { color: var(--text-dim); }
      50% { color: #00d4aa; }
    }

    .instruction-toggle.glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .instruction-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
      padding: 0 20px;
    }

    .instruction-box.expanded .instruction-content {
      max-height: 600px;
      padding: 0 20px 20px 20px;
    }

    .instruction-content-inner {
      border-top: 1px solid rgba(0, 212, 170, 0.12);
      padding-top: 16px;
    }

    .instruction-steps {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: step;
    }

    .instruction-steps li {
      counter-increment: step;
      padding: 4px 0 4px 32px;
      position: relative;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .instruction-steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 22px; height: 22px;
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #00d4aa;
    }

    .instruction-steps li strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .instruction-steps li .highlight {
      color: #00d4aa;
      font-weight: 500;
    }

    .instruction-steps li .icon-dots {
      display: inline-block;
      font-weight: 700;
      color: #00d4aa;
      letter-spacing: 1px;
    }

    .form-group { margin-bottom: 20px; }

    .label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 18px;
    }

    .input {
      width: 100%;
      padding: 16px 20px 16px 55px;
      background: var(--bg-input);
      border: 2px solid var(--input-border);
      border-radius: 16px;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--accent-1);
      background: var(--bg-input-focus);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .input::placeholder { color: var(--text-placeholder); }

    .hint {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint i { font-size: 11px; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-generate {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      margin-bottom: 15px;
    }

    .btn-generate:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    .btn-generate:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-copy {
      background: var(--bg-copy-btn);
      color: var(--text-primary);
      border: 1px solid var(--bg-copy-btn-border);
      display: none;
    }

    .btn-copy:hover {
      background: var(--bg-input-focus);
      transform: translateY(-2px);
    }

    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .spinner {
      width: 45px; height: 45px;
      border: 4px solid rgba(102, 126, 234, 0.2);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    .loading-text {
      color: var(--text-muted);
      font-
